name: M3 editor Windows GUI validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-editor-validation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PSD bridge dependencies
        working-directory: packages/psd-bridge
        run: npm ci

      - name: Build PSD bridge
        working-directory: packages/psd-bridge
        run: npm run build

      - name: Install editor dependencies
        working-directory: apps/editor
        run: npm ci

      - name: Build editor
        working-directory: apps/editor
        run: npm run build

      - name: Typecheck editor
        working-directory: apps/editor
        run: npm run typecheck

      - name: Test document compatibility and validation
        working-directory: apps/editor
        run: npm test

      - name: Run Windows Electron M3 editing and .nbdoc reopen GUI smoke
        working-directory: apps/editor
        run: npm run smoke:m3-gui

