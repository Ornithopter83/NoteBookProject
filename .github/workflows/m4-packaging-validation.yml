name: M4 Windows package validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-package-validation:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/editor/package-lock.json

      - name: Install and build PSD bridge
        working-directory: packages/psd-bridge
        run: |
          npm ci
          npm run build

      - name: Validate AI bridge
        working-directory: packages/ai-bridge
        run: npm run check

      - name: Install editor and packaging dependencies
        working-directory: apps/editor
        run: npm ci

      - name: Build Windows package inputs
        working-directory: apps/editor
        run: npm run build

      - name: Locate optional original M8 SVG attachment
        shell: pwsh
        run: |
          $attachmentRoot = Join-Path $env:GITHUB_WORKSPACE 'temp\ProjectHub\attachments'
          if (Test-Path -LiteralPath $attachmentRoot) {
            $originalSvg = Get-ChildItem -LiteralPath $attachmentRoot -Filter 'Untitled.svg' -File -Recurse | Select-Object -First 1
            if ($originalSvg) { "NORTHSTAR_M8_SOURCE_SVG=$($originalSvg.FullName)" | Add-Content -Encoding utf8 $env:GITHUB_ENV }
          }

      - name: Run root Windows validation launcher (typecheck, unit tests, M1–M3/M5/M6/M8/M10 vector GUI)
        id: windows_validation
        shell: pwsh
        env:
          NORTHSTAR_TEST_LOG: ${{ runner.temp }}\northstar-test-results.log
          NORTHSTAR_M8_RESULT_FILE: ${{ runner.temp }}\northstar-m8-ai-export-results.json
          NORTHSTAR_M8_SOURCE_RENDER: ${{ runner.temp }}\northstar-m8-original-svg-render.png
        run: .\TEST-NORTHSTAR.bat

      - name: Record M8 AI export evidence
        if: always()
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'northstar-m8-ai-export-results.json'
          if (Test-Path -LiteralPath $resultPath) {
            $evidence = Get-Content -Encoding UTF8 -LiteralPath $resultPath | ConvertFrom-Json
            @"
          ## M8 AI export GUI validation

          - Synthetic photo fixture: **$($evidence.fixture)**
          - Illustrator save/reopen: **$($evidence.illustrator)**
          - Attached original SVG rendering: **$($evidence.originalSvg)**
          - Temporary file cleanup: **$($evidence.cleanup)**
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else {
            '## M8 AI export GUI validation' | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            'No M8 result report was produced; see the Windows validation log.' | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload M8 AI export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-m8-ai-export-evidence
          path: |
            ${{ runner.temp }}\northstar-m8-ai-export-results.json
            ${{ runner.temp }}\northstar-m8-original-svg-render.png
          if-no-files-found: warn
          retention-days: 14

      - name: Run isolated M7 launch and recovery E2E
        shell: pwsh
        run: .\apps\editor\scripts\m7-launch-e2e.ps1

      - name: Run root source-build launcher GUI E2E and verify Illustrator AI menu
        working-directory: apps/editor
        run: node scripts/m9-batch-gui-smoke.cjs

      - name: Run M10 real export persistence and Illustrator branch E2E
        id: m10_export
        working-directory: apps/editor
        shell: pwsh
        env:
          NORTHSTAR_M10_RESULT_FILE: ${{ runner.temp }}\northstar-m10-export-results.json
        run: node scripts/m10-export-persistence-smoke.cjs

      - name: Record M10 export persistence evidence
        if: always()
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'northstar-m10-export-results.json'
          if (Test-Path -LiteralPath $resultPath) {
            $evidence = Get-Content -Encoding UTF8 -LiteralPath $resultPath | ConvertFrom-Json
            @"
          ## M10 export persistence E2E

          - PNG/SVG/PDF: **$($evidence.pngSvgPdf)**
          - Illustrator installed/missing branch: **$($evidence.illustrator)**
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else {
            '## M10 export persistence E2E' | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            'No M10 result report was produced; see the Windows validation log.' | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload M10 export persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-m10-export-persistence-evidence
          path: ${{ runner.temp }}\northstar-m10-export-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Create unsigned x64 Windows ZIP package
        working-directory: apps/editor
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
        run: npm run package:win

      - name: Extract the package and verify its entry points
        id: extract
        shell: pwsh
        working-directory: apps/editor
        run: |
          $archive = Get-ChildItem release -Filter 'Northstar-Editor-*-win-x64.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Windows ZIP package was not generated.' }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'northstar-m4-extracted'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extractRoot -Force
          $appExe = Get-ChildItem -LiteralPath $extractRoot -Filter 'Northstar Editor.exe' -File -Recurse | Select-Object -First 1
          if (-not $appExe) { throw 'Packaged Northstar Editor.exe is missing.' }
          $appAsar = Get-ChildItem -LiteralPath $extractRoot -Filter 'app.asar' -File -Recurse | Select-Object -First 1
          if (-not $appAsar) { throw 'Packaged app.asar is missing.' }
          $repoRoot = (Resolve-Path (Join-Path $PWD '..\..')).Path
          $launchCheck = Join-Path $repoRoot 'apps\editor\scripts\m7-launch-check.ps1'
          & $launchCheck -ValidateExecutable $appExe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Northstar Editor.exe failed PE validation.' }
          & $launchCheck -ValidatePackageDirectory $appExe.DirectoryName
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Northstar Electron runtime package is incomplete.' }
          $packageBytes = (Get-Item -LiteralPath $archive.FullName).Length
          $expandedBytes = (Get-ChildItem -LiteralPath $extractRoot -File -Recurse | Measure-Object -Property Length -Sum).Sum
          "PACKAGED_EXE=$($appExe.FullName)" >> $env:GITHUB_OUTPUT
          "PACKAGE_PATH=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "PACKAGE_BYTES=$packageBytes" >> $env:GITHUB_OUTPUT
          "EXPANDED_BYTES=$expandedBytes" >> $env:GITHUB_OUTPUT
          "Package: $([math]::Round($packageBytes / 1MB, 2)) MiB; extracted: $([math]::Round($expandedBytes / 1MB, 2)) MiB." | Out-Host

      - name: Run GUI smoke against the extracted packaged app
        id: packaged_gui
        working-directory: apps/editor
        env:
          NORTHSTAR_PACKAGED_EXE: ${{ steps.extract.outputs.PACKAGED_EXE }}
        run: npm run smoke:packaged-gui

      - name: Record package evidence
        if: always() && steps.extract.outcome == 'success'
        shell: pwsh
        env:
          PACKAGE_BYTES: ${{ steps.extract.outputs.PACKAGE_BYTES }}
          EXPANDED_BYTES: ${{ steps.extract.outputs.EXPANDED_BYTES }}
          PACKAGE_PATH: ${{ steps.extract.outputs.PACKAGE_PATH }}
          PACKAGED_GUI_RESULT: ${{ steps.packaged_gui.outcome }}
          WINDOWS_VALIDATION_RESULT: ${{ steps.windows_validation.outcome }}
        run: |
          $packageMiB = [math]::Round(([double]$env:PACKAGE_BYTES / 1MB), 2)
          $expandedMiB = [math]::Round(([double]$env:EXPANDED_BYTES / 1MB), 2)
          @"
          ## M4 Windows packaging

          - Package: ``$env:PACKAGE_PATH``
          - ZIP size: **$packageMiB MiB** ($env:PACKAGE_BYTES bytes)
          - Extracted size: **$expandedMiB MiB** ($env:EXPANDED_BYTES bytes)
          - Signing: **unsigned internal validation build** (no Northstar code-signing certificate configured)
          - Packaged app GUI and M3 `.nbdoc` save/reopen: **$env:PACKAGED_GUI_RESULT**
          - Root Windows typecheck, unit tests, and M1/M2/M3/M5/M6/M8 GUI launcher: **$env:WINDOWS_VALIDATION_RESULT**
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload root Windows validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-windows-validation-log
          path: ${{ runner.temp }}\northstar-test-results.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows ZIP package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-editor-windows-x64-unsigned
          path: ${{ steps.extract.outputs.PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 14
