name: M1 Windows validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Editor dependencies
        working-directory: apps/editor
        run: npm ci

      - name: Confirm Electron installation
        working-directory: apps/editor
        run: npx electron --version

      - name: Build Editor
        working-directory: apps/editor
        run: npm run build

      - name: Typecheck Editor
        working-directory: apps/editor
        run: npm run typecheck

      - name: Test Editor
        working-directory: apps/editor
        run: npm test

      - name: Run Editor GUI smoke
        working-directory: apps/editor
        run: npm run smoke:gui

      - name: Install PSD bridge dependencies
        working-directory: packages/psd-bridge
        run: npm ci

      - name: Build PSD bridge
        working-directory: packages/psd-bridge
        run: npm run build

      - name: Test PSD bridge
        working-directory: packages/psd-bridge
        run: npm test

      - name: Check and test AI bridge
        working-directory: packages/ai-bridge
        run: npm run check
